name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The floor declared in go.mod, and whatever is current.
        go: ['1.25.0', 'stable']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Check formatting
        if: matrix.go == 'stable'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Cross-compile every target
        run: |
          for target in darwin/arm64 darwin/amd64 windows/amd64 linux/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build ./cmd/filestore
          done
